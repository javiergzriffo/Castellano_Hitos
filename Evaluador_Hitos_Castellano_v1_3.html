<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evaluador de Hitos v1.2 · Pedagogía en Castellano</title><style>
:root{font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;color:#182b43;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#14334f;color:white;padding:22px max(18px,calc((100vw - 1080px)/2));}header h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#c9d8e7}main{max-width:1110px;margin:24px auto;padding:0 16px 90px}h2{font-size:23px;margin:0 0 12px}h3{margin:0 0 9px;font-size:17px}.sub{color:#67788e;font-size:13px}.panel{background:white;border:1px solid #dee6f0;border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 3px 14px #22334a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stack{display:grid;gap:12px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tile{border:2px solid #d7e2ee;background:#f9fbfe;border-radius:14px;padding:17px;text-align:left;color:#244260;min-height:100px;cursor:pointer}.tile:hover{border-color:#3876ab}.tile.active{border-color:#1b5e94;background:#eaf4ff}.tile[disabled]{opacity:.55;cursor:not-allowed}.tile strong{display:block;font-size:18px}.tile span{display:block;font-size:13px;margin-top:5px}.btn{background:#fff;border:1px solid #c6d4e2;color:#244562;font-weight:650;padding:9px 13px;border-radius:10px;cursor:pointer}.btn:hover{background:#edf5fc}.btn.primary{background:#175c91;color:white;border-color:#175c91}.btn.danger{color:#a52c37;border-color:#e4b9bd}.btn:disabled{opacity:.45;cursor:not-allowed}label{display:block;font-size:13px;font-weight:650;margin:8px 0 4px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #c5d2df;border-radius:9px;background:white;color:#17324e;font:inherit}textarea{min-height:85px;resize:vertical}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.notice{background:#edf5ff;border-left:4px solid #3b74a5;border-radius:7px;padding:12px 15px;margin:14px 0}.warn{background:#f orm:uppercase;margin:0 0 9px}.student{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:9px;background:#eaf2fb;margin:4px}.mini{font-size:12px}.valid{color:#23653c}.invalid{color:#a43238}@media(max-width:600px){main{padding:0 10px 80px;margin-top:14px}.panel,.item{padding:14px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.level{font-size:13px;min-height:58px}.item-head{display:block}h2{font-size:20px}}@media print{header,.no-print{display:none!important}main{margin:0}.panel,.item{break-inside:avoid;box-shadow:none}}

</style></head><body><header><h1>Evaluador de Hitos</h1><p>Pedagogía en Castellano · UCSH · herramienta local</p></header><main><div id="app"></div></main><input type="file" id="jsonFile" accept=".json,application/json" hidden><input type="file" id="sessionFile" accept=".json,application/json" hidden><script>
'use strict';
const RUBRIC=[{"id": 1, "ra": "2.1", "text": "Problematiza fenómenos sociales y políticos presentes en el microcuento o vinculados con su interpretación, analizando las perspectivas, valores o dilemas éticos que expresan mediante evidencia textual y contextual pertinente.", "max": 3, "indicators": ["Identifica fenómenos sociales y políticos relevantes presentes en el microcuento o vinculados con su interpretación.", "Reconoce perspectivas, valores, tensiones o conflictos asociados a dichos fenómenos.", "Identifica dilemas éticos que emergen de las situaciones, discursos o representaciones presentes en el texto.", "Analiza críticamente las posiciones o visiones de mundo que el microcuento expresa, cuestiona o problematiza.", "Fundamenta sus interpretaciones a partir de evidencia textual y elementos del contexto sociocultural.", "Relaciona los dilemas éticos identificados con responsabilidades propias del ejercicio profesional docente.", "Justifica de qué manera el abordaje pedagógico del texto puede favorecer una reflexión ética y crítica en los estudiantes."]}, {"id": 2, "ra": "3.1", "text": "Comunica oralmente una propuesta pedagógica coherente y fundamentada para favorecer la comprensión del microcuento, mediante una exposición clara, precisa y organizada, utilizando vocabulario disciplinar y pedagógico pertinente.", "max": 3, "indicators": ["Formula una propuesta pedagógica coherente con las demandas de comprensión que plantea el microcuento.", "Expone la propuesta con claridad, precisión y una organización comprensible para la audiencia.", "Emplea vocabulario disciplinar y pedagógico pertinente al ámbito profesional docente.", "Explica las decisiones pedagógicas adoptadas y las relaciona con características específicas del microcuento.", "Fundamenta la selección y aplicación de estrategias a partir del análisis lingüístico, literario y sociocultural del texto.", "Comunica de manera articulada la relación entre el análisis disciplinar del microcuento y su abordaje pedagógico.", "Responde preguntas o solicitudes de profundización mediante argumentos consistentes con la propuesta presentada."]}, {"id": 3, "ra": "4.1", "text": "Analiza cómo los fenómenos socioculturales presentes en el microcuento pueden incidir en su comprensión, considerando los conocimientos previos y las experiencias de los posibles lectores, así como las dificultades o diferencias interpretativas que podrían producirse.", "max": 3, "indicators": ["Identifica fenómenos socioculturales relevantes presentes en el microcuento.", "Explica de qué manera dichos fenómenos inciden en la construcción de sentido del texto.", "Relaciona elementos socioculturales del microcuento con los conocimientos previos y experiencias de los posibles lectores.", "Reconoce que las características socioculturales de los estudiantes pueden favorecer interpretaciones diversas del texto.", "Analiza posibles dificultades de comprensión asociadas a referencias, valores, prácticas o conocimientos culturales presentes en el microcuento.", "Fundamenta decisiones pedagógicas pertinentes para abordar esas diferencias y favorecer la comprensión del texto en un contexto educativo."]}, {"id": 4, "ra": "7.3", "text": "Distingue las demandas de comprensión superficial, profunda o inferencial y crítico-reflexiva que plantea el microcuento.", "max": 3, "indicators": ["Distingue las demandas de comprensión propias de los niveles literal o superficial, inferencial o profundo y crítico-reflexivo.", "Selecciona estrategias de lectura pertinentes para cada nivel de comprensión.", "Relaciona las estrategias seleccionadas con características lingüísticas, literarias y socioculturales específicas del microcuento.", "Justifica la pertinencia de cada estrategia a partir de las demandas de comprensión que plantea el texto.", "Aplica las estrategias seleccionadas sobre fragmentos o elementos concretos del microcuento.", "Explica de qué manera la aplicación de cada estrategia favorece el avance hacia niveles progresivamente más complejos de comprensión."]}, {"id": 5, "ra": "7.3", "text": "Selecciona y justifica estrategias pertinentes para los tres niveles de comprensión, en función de las demandas lectoras y las características lingüísticas, literarias y socioculturales del microcuento.", "max": 6, "indicators": ["Distingue las demandas de comprensión propias de los niveles literal o superficial, inferencial o profundo y crítico-reflexivo.", "Selecciona estrategias de lectura pertinentes para cada nivel de comprensión.", "Relaciona las estrategias seleccionadas con características lingüísticas, literarias y socioculturales específicas del microcuento.", "Justifica la pertinencia de cada estrategia a partir de las demandas de comprensión que plantea el texto.", "Aplica las estrategias seleccionadas sobre fragmentos o elementos concretos del microcuento.", "Explica de qué manera la aplicación de cada estrategia favorece el avance hacia niveles progresivamente más complejos de comprensión."]}, {"id": 6, "ra": "7.3", "text": "Modela las estrategias seleccionadas sobre fragmentos o elementos concretos del microcuento, explicando cómo su aplicación favorece la comprensión en cada nivel y el avance hacia niveles progresivamente más complejos.", "max": 3, "indicators": ["Distingue las demandas de comprensión propias de los niveles literal o superficial, inferencial o profundo y crítico-reflexivo.", "Selecciona estrategias de lectura pertinentes para cada nivel de comprensión.", "Relaciona las estrategias seleccionadas con características lingüísticas, literarias y socioculturales específicas del microcuento.", "Justifica la pertinencia de cada estrategia a partir de las demandas de comprensión que plantea el texto.", "Aplica las estrategias seleccionadas sobre fragmentos o elementos concretos del microcuento.", "Explica de qué manera la aplicación de cada estrategia favorece el avance hacia niveles progresivamente más complejos de comprensión."]}, {"id": 7, "ra": "9.1", "text": "Analiza recursos lingüísticos relevantes del microcuento y modela su análisis sobre elementos concretos del texto, explicando su incidencia en la comprensión y su pertinencia para el desarrollo de estrategias de lectura.", "max": 3, "indicators": ["Identifica recursos lingüísticos relevantes del microcuento que inciden en su comprensión.", "Explica la función que cumplen dichos recursos en la construcción de significado.", "Relaciona recursos léxicos, gramaticales, referenciales o discursivos con dificultades o posibilidades de comprensión del microcuento.", "Modela el análisis de recursos lingüísticos concretos sobre fragmentos del microcuento.", "Selecciona estrategias de lectura pertinentes a partir de los recursos lingüísticos identificados.", "Fundamenta la relación entre el análisis lingüístico realizado y el desarrollo de la comprensión lectora en un contexto pedagógico."]}, {"id": 8, "ra": "10.1", "text": "Analiza críticamente los sentidos y valores presentes en el microcuento, estableciendo relaciones fundamentadas con su contexto sociocultural mediante evidencia textual pertinente.", "max": 3, "indicators": ["Analiza los elementos intratextuales del microcuento que contribuyen a la construcción de sus sentidos.", "Relaciona los sentidos del texto con elementos relevantes de su contexto sociocultural.", "Reconoce valores, perspectivas, conflictos o representaciones presentes en el microcuento.", "Formula interpretaciones reflexivas sustentadas en evidencia textual.", "Examina posibles vínculos entre el microcuento, la identidad y las experiencias socioculturales de los lectores.", "Fundamenta la pertinencia de las interpretaciones propuestas para favorecer el desarrollo de habilidades de lectura literaria."]}, {"id": 9, "ra": "10.4", "text": "Analiza las características genéricas y los recursos narrativos y retóricos del microcuento y cómo estos plantean demandas de comprensión para los lectores.", "max": 3, "indicators": ["Reconoce las características del microcuento que permiten situarlo dentro de su estatuto genérico.", "Identifica los principales recursos narrativos y retóricos presentes en el texto y explica su incidencia en la construcción de sentido.", "Analiza los elementos del contexto de producción que resultan pertinentes para la interpretación del microcuento.", "Selecciona los elementos disciplinares más relevantes para sustentar una interpretación fundamentada del texto.", "Relaciona el análisis literario realizado con las demandas de comprensión que el microcuento plantea a los lectores.", "Justifica la pertinencia de los elementos disciplinares seleccionados para orientar el posterior abordaje pedagógico del texto."]}];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={step:'hito',hito:400,role:null,base:null,raters:[{id:'E1',name:'Evaluador 1'}],priority:{},students:[],course:'',date:new Date().toISOString().slice(0,10),judgments:{},assistantName:'',assistantNotes:{},individual:{},logoJPEG:null,compiled:false};
const lv=['Insuficiente','Parcial','Adecuado','Destacado'];
function btn(title,fn,style=''){return `<button class="btn ${style}" onclick="${esc(fn)}">${title}</button>`}
function paint(){const a=$('app');if(state.step==='hito'){a.innerHTML=`<div class="panel"><div class="step">Paso 1 de 4</div><h2>¿Qué hito evaluaremos?</h2><div class="grid">${[400,800,1000].map(n=>`<button class="tile ${n===400?'':'disabled'}" ${n!==400?'disabled':''} onclick="pickHito(${n})"><strong>Nivel ${n}</strong><span>${n===400?'Escala de apreciación disponible':'En construcción'}</span></button>`).join('')}</div><div class="notice">La rúbrica de nivel 400 se basa en el documento oficial compartido. Los niveles 800 y 1000 permanecen deshabilitados hasta incorporar sus instrumentos.</div></div>`;return}
if(state.step==='role'){a.innerHTML=`<div class="panel"><div class="step">Paso 2 de 4 · HITO ${state.hito}</div><h2>¿Cuál es tu rol?</h2><div class="grid"><button class="tile" onclick="pickRole('formulador')"><strong>Formulador de evaluación</strong><span>Configurar la evaluación, consolidar juicios y preparar retroalimentación.</span></button><button class="tile" onclick="pickRole('asistente')"><strong>Asistencia en evaluación</strong><span>Proponer puntajes y observaciones para compartir con el formulador.</span></button></div><div class="notice"><b>¿Qué hace cada rol?</b> El formulador genera y consolida la evaluación final. El asistente consulta la rúbrica, registra su propio juicio y lo remite al formulador. Un juicio compartido no se sincroniza automáticamente: se importa o pega.</div>${btn('← Volver','state.step="hito";paint()')}</div>`;return}
if(state.step==='config')return drawConfig();if(state.step==='students')return drawStudents();if(state.step==='evaluation')return drawEvaluation();if(state.step==='summary')return drawSummary();}
function pickHito(n){state.hito=n;state.step='role';paint()}function pickRole(r){state.role=r;state.step='config';paint()}
function importButton(){return btn(state.base?'Cambiar Base Maestra JSON':'Importar Base Maestra JSON','$("jsonFile").click()')}
function drawConfig(){let form=state.role==='formulador';$('app').innerHTML=`<div class="panel"><div class="step">Paso 3 de 4 · ${form?'Formulador':'Asistencia'} · HITO 400</div><h2>Configuración</h2><div class="bar">${importButton()}${state.base?'<span class="tag valid">Base importada</span>':'<span class="tag">Opcional</span>'}</div><p class="sub">La Base Maestra solo se utiliza para buscar estudiantes y cursos. No se modifica automáticamente.</p>${form?`<div class="cols"><div><label>Fecha de evaluación</label><input id="date" type="date" value="${esc(state.date)}" onchange="state.date=this.value"></div><div><label>Número de evaluadores</label><input id="raterCount" type="number" min="1" max="15" value="${state.raters.length}" onchange="changeRaterCount(this.value)"></div></div><h3 style="margin-top:15px">Identificación de evaluadores</h3><div class="cols">${state.raters.map((r,i)=>`<div><label>Evaluador ${i+1}</label><input value="${esc(r.name)}" oninput="state.raters[${i}].name=this.value"></div>`).join('')}</div><hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0"><h3>Prioridad de juicio por ítem</h3><p class="sub">Marca hasta dos evaluadores con prioridad en cada ítem. Su voto pesará 1,5, salvo si lo marcan como juicio débil (entonces pesará 0,5).</p><div class="stack">${RUBRIC.map(it=>`<div class="rater"><b>Ítem ${it.id} · RA ${it.ra}</b><div class="mini">${esc(it.text)}</div><div class="bar">${state.raters.map(r=>`<label class="inline-label"><input type="checkbox" ${state.priority[it.id]?.includes(r.id)?'checked':''} onchange="togglePriority(${it.id},'${r.id}',this)"> ${esc(r.name)}</label>`).join('')}</div></div>`).join('')}</div><div class="cols"><div><label>Curso asociado</label><input id="courseInput" list="courses" value="${esc(state.course)}" placeholder="Ej.: B:RPC403 o nombre manual" oninput="state.course=this.value"><datalist id="courses">${courses().map(c=>`<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join('')}</datalist></div></div>`:`<div class="cols"><div><label>Tu nombre o identificador</label><input value="${esc(state.assistantName)}" placeholder="Ej.: Evaluador 2" oninput="state.assistantName=this.value"></div><div><label>Fecha de evaluación</label><input type="date" value="${esc(state.date)}" onchange="state.date=this.value"></div></div><p class="notice">Puedes identificar a los estudiantes antes de evaluar. Los juicios y comentarios individuales se compartirán junto con tu propuesta.</p>`}<div class="bar" style="margin-top:20px">${btn('← Cambiar rol','state.step="role";paint()')}${btn('Configurar estudiantes →','state.step="students";paint()','primary')}${btn('Abrir sesión guardada','$("sessionFile").click()')}</div></div>`}
function courses(){return Object.values(state.base?.planes_estudio||{}).flatMap(p=>Object.values(p.cursos||{}))}
function students(){return Object.values(state.base?.estudiantes?.por_rut||{})}
function changeRaterCount(num){num=Math.max(1,Math.min(15,Number(num)||1));state.raters=Array.from({length:num},(_,i)=>state.raters[i]||{id:'E'+(i+1),name:'Evaluador '+(i+1)});for(const key in state.priority)state.priority[key]=state.priority[key].filter(x=>state.raters.some(r=>r.id===x));paint()}
function togglePriority(item,id,box){let arr=state.priority[item]||[];if(box.checked&&arr.length>=2){alert('Se permite priorizar como máximo a dos evaluadores por ítem.');box.checked=false;return}state.priority[item]=box.checked?[...arr,id]:arr.filter(x=>x!==id)}
function showManualStudent(){let name=prompt('Nombre del estudiante');if(!name?.trim())return;let rut=prompt('RUT (opcional, puede quedar en blanco)')||'';addStudent(name.trim(),rut.trim())}
function addStudent(n,r){if(state.students.some(s=>r&&s.rut===r)){alert('Este estudiante ya está incluido.');return}state.students.push({name:n,rut:r});paint()}
function selectStudent(){let id=$('studentPick').value;if(!id)return;let s=students().find(x=>x.rut===id);if(s)addStudent(s.nombre_completo,s.rut)}
function removeStudent(i){state.students.splice(i,1);paint()}
function judgment(id,rid){return state.judgments[id]?.[rid]||{score:null,weak:false,comment:''}}
function setJudgment(id,rid,prop,val){state.judgments[id] ||= {};state.judgments[id][rid] ||= {score:null,weak:false,comment:''};state.judgments[id][rid][prop]=val;updateLive(id)}
function scoreFor(it,sc){return sc===null?null:(it.max===6?sc*2:sc)}
function valueFor(it,j,rid){if(j.score===null)return null;return {points:scoreFor(it,j.score),weight:j.weak?.5:(state.priority[it.id]||[]).includes(rid)?1.5:1}}
function aggregate(it,studentIndex=null){
 const votes=state.raters.map(r=>{
  let j=judgment(it.id,r.id),x=studentIndex===null?null:individualEntry(it.id,r.id,studentIndex);
  // Solo un puntaje específico sustituye al grupal; un comentario no altera la nota.
  let sc=x&&x.score!==''&&x.score!==null&&x.score!==undefined?Number(x.score):j.score;
  if(sc===null||!Number.isInteger(sc)||sc<0||sc>3)return null;
  return {points:scoreFor(it,sc),weight:j.weak?.5:(state.priority[it.id]||[]).includes(r.id)?1.5:1};
 }).filter(Boolean);
 return votes.length?votes.reduce((s,v)=>s+v.points*v.weight,0)/votes.reduce((s,v)=>s+v.weight,0):null;
}
function updateLive(item){const it=RUBRIC.find(x=>x.id===item),el=$('live_'+item);if(el){let v=aggregate(it);el.textContent=v===null?'Sin juicios':`Puntaje provisional: ${fmt(v)} / ${it.max}`}}
function fmt(v){return Number(v).toLocaleString('es-CL',{maximumFractionDigits:2})}
function eligibleStudents(){let match=courses().find(c=>c.id===state.course||c.nombre===state.course),ss=students();return ss.filter(s=>!match||s.plan_estudio===match.plan_id).sort((a,b)=>{let ap=match&&a.avance_curricular?.[match.id]?.estado==='en_curso'?1:0,bp=match&&b.avance_curricular?.[match.id]?.estado==='en_curso'?1:0;return bp-ap||a.nombre_completo.localeCompare(b.nombre_completo,'es')})}
function drawStudents(){let form=state.role==='formulador',match=courses().find(c=>c.id===state.course||c.nombre===state.course);$('app').innerHTML=`<div class="panel"><div class="step">Participantes · HITO 400</div><h2>Estudiantes evaluados</h2><p class="sub">Puedes registrar estudiantes individuales, duplas o grupos. La selección se conserva durante esta evaluación y puedes cambiarla antes de una nueva rendición.</p><div class="bar">${btn('+ Agregar manualmente','showManualStudent()')}</div>${state.base?`<div class="studentpick"><label>Buscar estudiante de la Base Maestra</label><input id="searchStudent" placeholder="Buscar por nombre o RUT" oninput="filterStudentOptions()"><div id="studentChoices" class="stack" style="max-height:230px;overflow:auto"></div></div>`:''}<h3>Participantes (${state.students.length})</h3><div class="student-list">${state.students.map((s,i)=>`<span class="student">${esc(s.name)} ${s.rut?'· '+esc(s.rut):''} <button class="btnlink" onclick="removeStudent(${i})">Quitar</button></span>`).join('')||'<span class="sub">Todavía no hay estudiantes.</span>'}</div><div class="bar">${btn('← Configuración','state.step="config";paint()')}${btn('Comenzar rúbrica →','state.step="evaluation";paint()','primary')}</div></div>`;if(state.base)filterStudentOptions()}
function filterStudentOptions(){let root=$('studentChoices');if(!root)return;let term=($('searchStudent')?.value||'').toLowerCase();let match=courses().find(c=>c.id===state.course||c.nombre===state.course);let ss=eligibleStudents().filter(s=>!state.students.some(x=>x.rut===s.rut)&&(`${s.nombre_completo} ${s.rut}`).toLowerCase().includes(term));root.innerHTML=ss.slice(0,60).map(s=>`<button class="btn" style="text-align:left" onclick="addStudent(${JSON.stringify(s.nombre_completo).replace(/"/g,'&quot;')},${JSON.stringify(s.rut).replace(/"/g,'&quot;')})">${esc(s.nombre_completo)} · ${esc(s.rut)} ${match&&s.avance_curricular?.[match.id]?.estado==='en_curso'?'<span class="tag valid">En curso · prioridad</span>':''}</button>`).join('')||'<span class="sub">Sin coincidencias.</span>'}
function individualEntry(id,rid,idx){state.individual ||= {};let key=id+'|'+rid+'|'+idx;return state.individual[key]||{score:'',comment:''}}
function saveIndividual(id,rid,idx,prop,value){state.individual ||= {};let key=id+'|'+rid+'|'+idx;state.individual[key] ||= {score:'',comment:''};state.individual[key][prop]=value}
function togglePersonal(id,rid){let el=$('pers_'+id+'_'+rid);if(el)el.classList.toggle('hidden')}
function individualHTML(it,r){return `<div class="bar"><button class="btn small comment-btn" onclick="togglePersonal(${it.id},'${r.id}')">+ Puntaje o comentario para un estudiante</button></div><div id="pers_${it.id}_${r.id}" class="personalbox hidden"><p class="sub">El puntaje individual reemplaza el juicio grupal solo para ese estudiante y este ítem. Si se deja vacío, se aplica el juicio grupal. Los comentarios no aparecen en el PDF.</p>${state.students.length?state.students.map((s,i)=>{let x=individualEntry(it.id,r.id,i);return `<div class="personalbox"><b>${esc(s.name)}</b><div class="cols"><div><label>Puntaje individual</label><select onchange="saveIndividual(${it.id},'${r.id}',${i},'score',this.value)"><option value="">Sin puntaje individual</option>${[3,2,1,0].map(n=>`<option value="${n}" ${String(x.score)===String(n)?'selected':''}>${lv[n]} · ${scoreFor(it,n)} puntos</option>`).join('')}</select></div><div><label>Comentario individual</label><textarea placeholder="Observación para este estudiante" oninput="saveIndividual(${it.id},'${r.id}',${i},'comment',this.value)">${esc(x.comment)}</textarea></div></div></div>`}).join(''):'<p class="sub">Agrega participantes desde la etapa anterior.</p>'}</div>`}
function drawEvaluation(){let form=state.role==='formulador',raters=form?state.raters:[{id:'A1',name:state.assistantName||'Mi juicio'}];$('app').innerHTML=`<div class="between"><div><div class="step">HITO 400 · Evaluación</div><h2>${form?'Juicios de evaluadores':'Pauta de asistencia'}</h2><p class="sub">${esc(state.students.map(s=>s.name).join(' · ')||'Sin estudiantes identificados')} · ${esc(state.date)}</p></div><div class="bar">${btn('← Estudiantes','state.step="students";paint()')}${btn('Guardar sesión JSON','saveSession()')}</div></div><div class="items">${RUBRIC.map(it=>`<section class="item"><div class="item-head"><div><span class="tag">Ítem ${it.id}</span> <span class="tag">RA ${it.ra}</span> <span class="tag">Máx. ${it.max}</span><p class="item-title">${esc(it.text)}</p></div></div><button class="btnlink" onclick="toggleIndicator(${it.id})">Previsualizar desempeños</button><div id="perf_${it.id}" class="indicators hidden"><b>Matriz de referencia · RA ${it.ra}</b><ul>${it.indicators.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="raters-grid">${raters.map(r=>{let j=judgment(it.id,r.id);return `<div class="rater"><div class="between"><span class="rater-name">${esc(r.name)}</span>${form&&(state.priority[it.id]||[]).includes(r.id)?'<span class="tag">Prioridad ×1,5</span>':''}</div><div class="levels">${[3,2,1,0].map(n=>`<button class="level ${j.score===n?'selected':''}" data-level="${n}" onclick="chooseLevel(${it.id},'${r.id}',${n})">${lv[n]}<small>${scoreFor(it,n)} puntos</small></button>`).join('')}<button class="level pass ${j.score===null?'selected':''}" onclick="chooseLevel(${it.id},'${r.id}',null)">Pasar<small>Sin evidencia</small></button></div><label class="inline-label"><input type="checkbox" ${j.weak?'checked':''} onchange="setJudgment(${it.id},'${r.id}','weak',this.checked)"> Juicio débil (×0,5)</label>${j.comment!==''?`<textarea id="comment_${it.id}_${r.id}" oninput="setJudgment(${it.id},'${r.id}','comment',this.value)" placeholder="Comentario de quien evalúa">${esc(j.comment)}</textarea>`:`<div>${btn('+ Comentario del evaluador',`addComment(${it.id},'${r.id}')`)}</div>`}${individualHTML(it,r)}</div>`}).join('')}</div>${form?`<p class="foot" id="live_${it.id}">${aggregate(it)===null?'Sin juicios':`Puntaje grupal provisional: ${fmt(aggregate(it))} / ${it.max} · Se recalcula por estudiante al consolidar`}</p>`:''}</section>`).join('')}</div><div class="panel"><div class="bar">${btn('Consolidar →','state.step="summary";paint()','primary')}${btn('Guardar sesión JSON','saveSession()')}</div></div>`}
function addComment(id,r){setJudgment(id,r,'comment',' ');paint();let el=$(`comment_${id}_${r}`);el?.focus();if(el)el.value=''}
function chooseLevel(id,r,score){setJudgment(id,r,'score',score);paint();const el=$('perf_'+id);if(el)el.classList.add('hidden')}
function toggleIndicator(id){$('perf_'+id)?.classList.toggle('hidden')}
function results(studentIndex=null){return RUBRIC.map(it=>({item:it,final:aggregate(it,studentIndex)}))}
function raResults(studentIndex=null){let out={};for(let {item,final} of results(studentIndex)){out[item.ra] ||= [];if(final!==null)out[item.ra].push(final/item.max*100)}return Object.entries(out).map(([ra,vals])=>({ra,pct:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,valid:vals.length,total:RUBRIC.filter(x=>x.ra===ra).length}))}
function plainShare(){let form=state.role==='formulador',raters=form?state.raters:[{id:'A1',name:state.assistantName||'Mi juicio'}];let lines=['HITO 400 · JUICIOS EVALUATIVOS','Evaluación: '+state.date,'Curso: '+(state.course||'No indicado'),'Estudiantes: '+(state.students.map(s=>s.name).join('; ')||'No indicados'),''];for(let r of raters){lines.push('EVALUADOR: '+r.name);for(let it of RUBRIC){let j=judgment(it.id,r.id);lines.push(`${it.id}. [RA ${it.ra}] ${j.score===null?'PASAR':lv[j.score]+' ('+scoreFor(it,j.score)+'/'+it.max+')'}${j.weak?' · JUICIO DÉBIL':''}`);if(j.comment.trim())lines.push('   Comentario: '+j.comment.trim());state.students.forEach((st,i)=>{let x=individualEntry(it.id,r.id,i);if(String(x.score)!==''||x.comment.trim())lines.push('   '+st.name+': '+(String(x.score)!==''?lv[Number(x.score)]+' ('+scoreFor(it,Number(x.score))+'/'+it.max+')':'sin puntaje específico')+(x.comment.trim()?' · '+x.comment.trim():''))})}lines.push('')}return lines.join('\n')}
function numericShare(){let lines=['HITO 400 · RESULTADOS NUMÉRICOS CONSOLIDADOS','Curso: '+(state.course||'No informado'),'Fecha: '+state.date,''];let indices=state.students.length?state.students.map((s,i)=>i):[null];for(let i of indices){lines.push('ESTUDIANTE: '+(i===null?'Sin identificar':state.students[i].name+(state.students[i].rut?' · '+state.students[i].rut:'')));for(let it of RUBRIC){let p=aggregate(it,i);lines.push('Ítem '+it.id+' · RA '+it.ra+': '+(p===null?'Sin evidencia':fmt(p)+' / '+it.max+' ('+fmt(p/it.max*100)+' %)'))}let rr=raResults(i);for(let r of rr)lines.push('RA '+r.ra+': '+(r.pct===null?'Sin evidencia':fmt(r.pct)+' %'));let val=rr.filter(r=>r.pct!==null);lines.push('LOGRO GENERAL: '+(val.length?fmt(val.reduce((a,r)=>a+r.pct,0)/val.length)+' %':'Sin evidencia'),'')}return lines.join('\n')}
async function shareNumbers(){let t=numericShare();if(navigator.share){try{await navigator.share({text:t,title:'Resultados consolidados HITO 400'});return}catch(e){if(e.name==='AbortError')return}}copyText(t)}
function evaluateAnother(){if(!confirm('¿Iniciar otra evaluación? Se conservarán la configuración, fecha, curso y evaluadores. Los juicios y estudiantes actuales se limpiarán. Guarda la sesión si necesitas conservarlos.'))return;state.students=[];state.judgments={};state.individual={};state.step='students';paint()}
function raDescription(ra){return state.base?.perfil_egreso?.resultados_aprendizaje?.[ra]?.descripcion||({ '2.1':'Reflexionar críticamente sobre fenómenos sociales y políticos y sus implicancias éticas.', '3.1':'Elaborar y comunicar propuestas pertinentes mediante el lenguaje oral y escrito.', '4.1':'Interpretar críticamente los fenómenos que influyen en el proceso socioeducativo.', '7.3':'Desarrollar niveles de comprensión lectora mediante métodos y estrategias pertinentes.', '9.1':'Analizar la incidencia de recursos lingüísticos en la comprensión y producción textual.', '10.1':'Promover el diálogo reflexivo sobre textos literarios y sus contextos.', '10.4':'Analizar e interpretar textos literarios atendiendo a género, composición y contexto.'})[ra]||'Resultado de aprendizaje '+ra}
function performance(v,max){if(v===null)return 'Sin evidencia';let x=v/max;return x>=5/6?'Destacado':x>=.5?'Adecuado':x>=1/6?'Parcial':'Insuficiente'}
function reportHTML(){let indices=state.students.length?state.students.map((s,i)=>i):[null];return indices.map(i=>{let rs=raResults(i),vals=rs.filter(r=>r.pct!==null),overall=vals.length?vals.reduce((a,r)=>a+r.pct,0)/vals.length:null;return `<div class="panel"><div class="step">Reporte de desempeño · HITO 400</div><h2>Reporte de desempeño Hito evaluativo 400</h2><p class="sub">${esc(state.course||'Curso no informado')} · ${esc(state.date)}</p><h3>${esc(i===null?'Sin estudiante identificado':state.students[i].name)}${i!==null&&state.students[i].rut?' · '+esc(state.students[i].rut):''}</h3>${rs.map(r=>`<div class="report-ra"><div class="between"><b>RA ${esc(r.ra)} · ${esc(raDescription(r.ra))}</b><span class="reportbig">${r.pct===null?'—':fmt(r.pct)+' %'}</span></div>${RUBRIC.filter(it=>it.ra===r.ra).map(it=>{let p=aggregate(it,i);return `<p class="mini"><b>Ítem ${it.id}</b> ${esc(it.text)}<br><span class="sub">${p===null?'Sin evidencia':fmt(p)+' / '+it.max+' puntos · '+performance(p,it.max)}</span></p>`}).join('')}</div>`).join('')}<div class="report-ra"><b>Nivel de logro general del instrumento</b><div class="reportbig">${overall===null?'—':fmt(overall)+' %'}</div></div><p class="foot">Pedagogía en Castellano · Universidad Católica Silva Henríquez · HITO 400 · ${esc(state.date.slice(0,4))}</p></div>`}).join('')}
function drawSummary(){let form=state.role==='formulador',indices=state.students.length?state.students.map((s,i)=>i):[null];
 $('app').innerHTML=`<div class="panel"><div class="step">Consolidación · HITO 400</div><h2>${form?'Consolidado del formulador':'Resumen de mis juicios'}</h2><p class="sub">${form?'Cada estudiante recibe su propio resultado. Un puntaje individual sustituye el juicio grupal del mismo evaluador; los demás juicios grupales se mantienen.':'Juicios listos para compartir por WhatsApp o correo.'}</p>
 ${form?indices.map(i=>{let rr=raResults(i),valid=rr.filter(x=>x.pct!==null),overall=valid.length?valid.reduce((a,x)=>a+x.pct,0)/valid.length:null;return `<section class="student-summary"><h3>${esc(i===null?'Evaluación sin estudiantes':state.students[i].name)}</h3><div class="scroll"><table class="summary-table"><thead><tr><th>Ítem</th><th>RA</th><th>Puntaje ponderado</th><th>Juicios aplicados</th></tr></thead><tbody>${RUBRIC.map(it=>{let final=aggregate(it,i);let votes=state.raters.map(r=>{let j=judgment(it.id,r.id),ind=i===null?null:individualEntry(it.id,r.id,i),custom=ind&&ind.score!==''&&ind.score!==null&&ind.score!==undefined,sc=custom?Number(ind.score):j.score,w=j.weak?.5:(state.priority[it.id]||[]).includes(r.id)?1.5:1;return esc(r.name)+': '+(sc===null?'Pasar':fmt(scoreFor(it,sc))+' (×'+fmt(w)+')'+(custom?' · individual':''))}).join('<br>');return `<tr><td>${it.id}</td><td>${it.ra}</td><td><b>${final===null?'Sin evidencia':fmt(final)+' / '+it.max}</b></td><td>${votes}</td></tr>`}).join('')}</tbody></table></div><div class="grid">${rr.map(x=>`<div class="stat"><span>RA ${x.ra} · ${x.valid}/${x.total} ítems</span><div class="big">${x.pct===null?'—':fmt(x.pct)+' %'}</div></div>`).join('')}</div><div class="stat"><b>Logro general de ${esc(i===null?'la evaluación':state.students[i].name)}</b><div class="big">${overall===null?'—':fmt(overall)+' %'}</div></div></section>`}).join(''):`<div class="scroll"><table class="summary-table"><thead><tr><th>Ítem</th><th>RA</th><th>Juicio</th><th>Observación</th></tr></thead><tbody>${RUBRIC.map(it=>{let j=judgment(it.id,'A1');return `<tr><td>${it.id}</td><td>${it.ra}</td><td>${j.score===null?'Pasar':fmt(scoreFor(it,j.score))+' / '+it.max}${j.weak?' · débil':''}</td><td>${esc(j.comment||'—')}</td></tr>`}).join('')}</tbody></table></div>`}
 <div class="notice">La ausencia de evidencia no se considera un cero. Cada RA promedia sus ítems válidos en porcentajes; el logro global promedia los RA con evidencia.</div><div class="bar">${btn('← Modificar juicios','state.step="evaluation";paint()')}${form?btn('Importar juicio de asistente','showAssistantImport()'):btn('Compartir juicio','shareAssistant()','primary')}${form?btn('Compartir resultados numéricos','shareNumbers()','primary'):btn('Copiar texto','copyText(plainShare())')}${form?btn('Compartir comentarios','shareAssistant()'):''}${form?btn('Ver reporte de desempeño','showReport()','primary'):''}${form?btn('Exportar consolidado CSV','downloadCSV()'):''}${btn('Evaluar otro estudiante / grupo','evaluateAnother()')}${btn('Guardar sesión JSON','saveSession()')}</div></div>`;
}
function showReport(){$('app').innerHTML=reportHTML()+`<div class="panel"><div class="bar">${btn('← Volver al consolidado','state.step="summary";paint()')}${btn('Descargar PDF','downloadReportPDF()','primary')}${btn('Evaluar otro grupo','evaluateAnother()')}</div></div>`}
function showAssistantImport(){const html=`<div class="panel"><h3>Importar propuesta de asistencia</h3><p class="sub">Pega el texto completo compartido por el asistente. Selecciona cuál evaluador representa antes de aplicarlo. Sus juicios reemplazarán los de ese evaluador, no los de los demás.</p><label>Evaluador de destino</label><select id="assistantTo">${state.raters.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><label>Texto recibido</label><textarea id="assistantPaste" rows="13" placeholder="HITO 400 · PROPUESTA DE JUICIO..."></textarea><div class="bar">${btn('Aplicar propuesta','applyAssistant()','primary')}${btn('Cancelar','state.step="summary";paint()')}</div></div>`;$('app').innerHTML+=html;$('assistantPaste').scrollIntoView({behavior:'smooth',block:'center'})}
function applyAssistant(){let text=$('assistantPaste').value,rid=$('assistantTo').value,matched=0;let parts=text.split(/\r?\n/);for(let i=0;i<parts.length;i++){let m=parts[i].match(/^\s*(\d+)\.\s*\[RA\s+[\d.]+\]\s*(PASAR|Destacado|Adecuado|Parcial|Insuficiente)/i);if(!m)continue;let id=Number(m[1]);if(!RUBRIC.some(it=>it.id===id))continue;let level=m[2].toLowerCase();let sc=level==='pasar'?null:lv.findIndex(x=>x.toLowerCase()===level);let weak=/JUICIO DÉBIL/i.test(parts[i]);let comment=(parts[i+1]||'').match(/^\s*Comentario:\s*(.+)$/i)?.[1]||'';state.judgments[id] ||= {};state.judgments[id][rid]={score:sc,weak,comment};for(let p=i+1;p<parts.length&&!/^\s*\d+\.\s*\[RA/.test(parts[p]);p++){let line=parts[p].trim();for(let idx=0;idx<state.students.length;idx++){let st=state.students[idx];if(!line.startsWith(st.name+':'))continue;let note=line.slice(st.name.length+1).trim();let mscore=note.match(/^(Destacado|Adecuado|Parcial|Insuficiente)\s*\(/i);let desc=mscore?note.replace(/^[^)]*\)\s*(?:·\s*)?/,''):(note.startsWith('sin puntaje específico')?note.replace(/^sin puntaje específico\s*(?:·\s*)?/,''):note);saveIndividual(id,rid,idx,'score',mscore?String(lv.findIndex(x=>x.toLowerCase()===mscore[1].toLowerCase())):'');saveIndividual(id,rid,idx,'comment',desc)}}matched++}if(!matched){alert('No se reconocieron juicios. Pega el texto completo generado con «Compartir juicio».');return}alert(`Se importaron ${matched} ítems para el evaluador seleccionado.`);paint()}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Texto copiado. Puedes pegarlo en WhatsApp o correo.')}catch(e){let x=$('shareText');if(x){x.select();document.execCommand('copy');alert('Texto seleccionado para copiar.')}else alert('El navegador no permitió copiar automáticamente.')}}
async function shareAssistant(){let t=plainShare();if(navigator.share){try{await navigator.share({text:t,title:'Juicio HITO 400'});return}catch(e){if(e.name==='AbortError')return}}copyText(t)}
function downloadBlob(text,name,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function saveSession(){let s={schema:'castellano-hitos-v1',saved:new Date().toISOString(),...state,base:null};downloadBlob(JSON.stringify(s,null,2),`HITO400_${state.role}_${state.date}.json`,'application/json')}
function downloadCSV(){let rows=[['Ítem','RA','Indicador','Máximo','Puntaje consolidado','Porcentaje ítem','Juicios emitidos']];for(let {item,final} of results())rows.push([item.id,item.ra,item.text,item.max,final===null?'':fmt(final),final===null?'':fmt(final/item.max*100),state.raters.map(r=>{let j=judgment(item.id,r.id),v=valueFor(item,j,r.id);return r.name+': '+(v===null?'Pasó':fmt(v.points)+' peso '+fmt(v.weight))}).join(' | ')]);rows.push([]);rows.push(['RA','% logro','Ítems evaluados','Ítems totales']);for(let r of raResults())rows.push([r.ra,r.pct===null?'':fmt(r.pct),r.valid,r.total]);downloadBlob('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),`HITO400_Consolidado_${state.date}.csv`,'text/csv;charset=utf-8')}
